name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to publish to npm
        required: true
        type: string
      confirmation:
        description: Type publish to confirm npm publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
      - name: Validate publication request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"

          if [ "$CONFIRMATION" != "publish" ]; then
            echo "Publication confirmation must be exactly: publish" >&2
            exit 1
          fi

          if [ "$package_version" = "0.0.0" ]; then
            echo "Refusing to publish placeholder version 0.0.0" >&2
            exit 1
          fi

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" >/dev/null
      - run: npm ci
      - run: npm run headers:check
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: Verify validation did not modify tracked files
        run: git diff --exit-code
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
