name: tests
on:
  push:
  workflow_dispatch:
    inputs:
      coordination_only:
        description: Run isolated coordination regression tests without storage migration or backup tests
        type: boolean
        default: false

jobs:
  package-consumer:
    if: ${{ !inputs.coordination_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['20.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ matrix.node_version }}
      - run: npm ci
      - run: npm run test:package
  unit-tests:
    if: ${{ !inputs.coordination_only }}
    strategy:
      matrix:
        node_version: [lts/-1, lts/*, latest]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
  windows-unit-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.coordination_only
    strategy:
      matrix:
        node_version: [lts/-1, lts/*, latest]
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  coordination-regression:
    if: ${{ inputs.coordination_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: ['20.19.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 esbuild
      - run: npm run build
      - run: node ./node_modules/mocha/bin/mocha.js --forbid-only test/core/session/coordination-descriptors.test.ts test/core/execution/recovery-guard.test.ts test/core/session.test.ts
        env:
          TS_NODE_PROJECT: tsconfig.test.json
