name: tests
on:
  push:
  workflow_dispatch:

jobs:
  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['20.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node_version }}
      - run: npm ci
      - run: npm run test:package
  unit-tests:
    strategy:
      matrix:
        node_version: [lts/-1, lts/*, latest]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
  windows-unit-tests:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        node_version: [lts/-1, lts/*, latest]
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
