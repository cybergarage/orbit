name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json, for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      dist_tag: ${{ steps.policy.outputs.dist_tag }}
    defaults:
      run:
        working-directory: source
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed release policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: source/package-lock.json
          node-version: 20.19.0
      - name: Validate release tag
        id: policy
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse --verify HEAD)
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$source_commit" = "$tag_commit"
          dist_tag=$(node ../.github/scripts/npm-release-policy.mjs source "$RELEASE_TAG")
          printf 'dist_tag=%s\n' "$dist_tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run headers:check
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: Verify validation did not modify tracked files
        run: git diff --exit-code
  release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$DIST_TAG" in
            latest) set -- ;;
            next) set -- --prerelease --latest=false ;;
            *) echo "Missing or invalid release channel" >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag "$@"
