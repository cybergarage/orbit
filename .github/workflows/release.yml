name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json, for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"

          if [ "$package_version" = "0.0.0" ]; then
            echo "Refusing to release placeholder version 0.0.0" >&2
            exit 1
          fi

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - run: npm ci
      - run: npm run headers:check
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: Verify validation did not modify tracked files
        run: git diff --exit-code
  release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag
